services:
  whalekeeper:
    build: .
    container_name: whalekeeper
    restart: unless-stopped
    ports:
      - "5454:5454"
    volumes:
      # Mount Docker socket to manage containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Only read once, to import a config.yaml from a version before 1.1.57
      - ./config:/app/config
      # Persist database and configuration
      - ./data:/app/data
      # Live reload for app code (development)
      - ./app:/app/app
      # Live reload for version file
      - ./VERSION:/app/VERSION
      # Mount tests for development
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
    environment:
      - TZ=Europe/Brussels
